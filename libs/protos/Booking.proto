syntax = "proto3";

package booking;

service BookingService {
  rpc HoldSeats (HoldSeatsRequest) returns (HoldSeatsResponse);
  rpc ConfirmBooking (ConfirmBookingRequest) returns (ConfirmBookingResponse);
  rpc CancelBooking (CancelBookingRequest) returns (CancelBookingResponse);
  rpc GetBookingById (GetBookingByIdRequest) returns (BookingResponse);
  rpc GetUserBookings (GetUserBookingsRequest) returns (GetUserBookingsResponse);
  rpc GetTicketById (GetTicketByIdRequest) returns (GetTicketByIdResponse);
  rpc ValidateTicket (ValidateTicketRequest) returns (ValidateTicketResponse);
}

// --- Request / Response Messages ---

message HoldSeatsRequest {
  string user_id = 1;
  string showtime_id = 2;
  repeated string seat_ids = 3;
}

message BookingSeatItem {
  string seat_id = 1;
  string seat_identifier = 2;
  string seat_type = 3;
  double unit_price = 4;
}

message TicketItem {
  string id = 1;
  string seat_id = 2;
  string ticket_number = 3;
  string qr_code_token = 4;
  string status = 5;
  optional string used_at = 6;
  optional string scanned_by_user_id = 7;
}

message BookingResponse {
  string id = 1;
  string booking_reference = 2;
  string user_id = 3;
  string showtime_id = 4;
  string cinema_id = 5;
  string auditorium_id = 6;
  double total_amount = 7;
  string currency = 8;
  string status = 9;
  optional string payment_id = 10;
  string hold_expires_at = 11;
  optional string confirmed_at = 12;
  string created_at = 13;
  repeated BookingSeatItem seats = 14;
  repeated TicketItem tickets = 15;
}

message HoldSeatsResponse {
  BookingResponse booking = 1;
  int32 hold_duration_seconds = 2;
}

message ConfirmBookingRequest {
  string booking_id = 1;
  string payment_id = 2;
}

message ConfirmBookingResponse {
  BookingResponse booking = 1;
}

message CancelBookingRequest {
  string booking_id = 1;
  string user_id = 2;
  optional string reason = 3;
}

message CancelBookingResponse {
  bool success = 1;
  string message = 2;
}

message GetBookingByIdRequest {
  string booking_id = 1;
  string user_id = 2;
  bool is_admin = 3;
}

message GetUserBookingsRequest {
  string user_id = 1;
  int32 page = 2;
  int32 limit = 3;
}

message GetUserBookingsResponse {
  repeated BookingResponse bookings = 1;
  int32 total = 2;
  int32 page = 3;
  int32 limit = 4;
}

message GetTicketByIdRequest {
  string ticket_id = 1;
  string user_id = 2;
  bool is_admin = 3;
}

message GetTicketByIdResponse {
  TicketItem ticket = 1;
  BookingResponse booking = 2;
}

message ValidateTicketRequest {
  string qr_token = 1;
  optional string gate_cinema_id = 2;
  optional string gate_auditorium_id = 3;
  string scanned_by_user_id = 4;
  string scanned_by_user_email = 5;
}

message ValidateTicketResponse {
  bool valid = 1;
  string ticket_number = 2;
  string status = 3;
  string movie_title = 4;
  string cinema_name = 5;
  string auditorium_name = 6;
  string seat_number = 7;
  string showtime_start = 8;
  string scanned_at = 9;
  string scanned_by = 10;
}
