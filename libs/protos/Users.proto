syntax = "proto3";

package user;

service UsersService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {}
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc CurrentUser(CurrentUserRequest) returns (CurrentUserResponse) {}
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse) {}
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {}
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse) {}
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {}
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {}
  rpc RequestChangeEmail(RequestChangeEmailRequest) returns (RequestChangeEmailResponse) {}
  rpc ConfirmChangeEmail(ConfirmChangeEmailRequest) returns (ConfirmChangeEmailResponse) {}
  rpc FreezeAccount(FreezeAccountRequest) returns (FreezeAccountResponse) {}
  rpc RollbackEmail(RollbackEmailRequest) returns (RollbackEmailResponse) {}
  rpc ResendVerificationCode(ResendVerificationCodeRequest) returns (ResendVerificationCodeResponse) {}
  rpc UpdateUserStatus(UpdateUserStatusRequest) returns (UpdateUserStatusResponse) {}
  rpc UpdateUserRole(UpdateUserRoleRequest) returns (UpdateUserRoleResponse) {}
  rpc Logout(LogoutRequest) returns (LogoutResponse) {}
  rpc GoogleLogin(GoogleLoginRequest) returns (LoginResponse) {}
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_UNVERIFIED = 1;
  USER_STATUS_ACTIVE = 2;
  USER_STATUS_SUSPENDED = 3;
  USER_STATUS_BLOCKED = 4;
  USER_STATUS_DELETED = 5;
}

message CropData {
  int32 x = 1;
  int32 y = 2;
  int32 width = 3;
  int32 height = 4;
  optional float zoom = 5;
}

message RegisterRequest {
  string name = 1;
  string email = 2;
  string password = 3;
  optional string birth_date = 4;
  string gender = 5;
  string country = 6;
  optional string temp_object_key = 7;
  optional float crop_x = 8;
  optional float crop_y = 9;
  optional float crop_width = 10;
  optional float crop_height = 11;
  optional float crop_zoom = 12;
}

message RegisterResponse {
  string id = 1;
  string message = 2;
  CurrentUserResponse user = 3;
}

message VerifyEmailRequest {
  string email = 1;
  int32 code = 2;
}

message VerifyEmailResponse {
  string message = 1;
}

message LoginRequest {
  string email = 1;
  string password = 2;
  optional string user_agent = 3;
  optional string ip_address = 4;
  optional string client_scope = 5;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  optional string scope = 3;
  optional string role = 4;
  optional string cinema_id = 5;
}

message CurrentUserRequest {
  string id = 1;
}

message CurrentUserResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string avatar_key = 4;
  string gender = 5;
  string country = 6;
  optional string birth_date = 7;
  string status = 8;
  optional string status_reason = 9;
  optional string suspended_until = 10;
  optional string status_changed_at = 11;
  string role = 12;
  optional string cinema_id = 13;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string message = 1;
  string access_token = 2;
  string refresh_token = 3;
}

message UpdateProfileRequest {
  string user_id = 1;
  optional string name = 2;
  optional string country = 3;
  optional string birth_date = 4;
  optional string temp_key = 5;
  optional float crop_x = 6;
  optional float crop_y = 7;
  optional float crop_width = 8;
  optional float crop_height = 9;
  optional float crop_zoom = 10;
}

message UpdateProfileResponse {
  string id = 1;
  string name = 2;
  string email = 3;
  string country = 4;
  optional string birth_date = 5;
  optional string avatar_key = 6;
  string status = 7;
  optional string status_reason = 8;
  optional string suspended_until = 9;
  optional string status_changed_at = 10;
  string role = 11;
  optional string cinema_id = 12;
}

message ChangePasswordRequest {
  string user_id = 1;
  optional string old_password = 2;
  string new_password = 3;
  string confirm_password = 4;
  optional string user_agent = 5;
  optional string ip_address = 6;
}

message ChangePasswordResponse {
  bool success = 1;
  string message = 2;
}

message ForgotPasswordRequest {
  string email = 1;
}

message ForgotPasswordResponse {
  string message = 1;
  bool success = 2;
}

message ResetPasswordRequest {
  string email = 1;
  string otp = 2;
  string new_password = 3;
  string confirm_password = 4;
}

message ResetPasswordResponse {
  string message = 1;
  bool success = 2;
}

message RequestChangeEmailRequest {
  string user_id = 1;
  optional string current_password = 2;
  string new_email = 3;
}

message RequestChangeEmailResponse {
  string message = 1;
  bool success = 2;
}

message ConfirmChangeEmailRequest {
  string user_id = 1;
  string code = 2;
}

message ConfirmChangeEmailResponse {
  string message = 1;
  bool success = 2;
}

message FreezeAccountRequest {
  string token = 1;
}

message FreezeAccountResponse {
  bool success = 1;
  string message = 2;
}

message RollbackEmailRequest {
  string token = 1;
}

message RollbackEmailResponse {
  bool success = 1;
  string message = 2;
}

message ResendVerificationCodeRequest {
  string email = 1;
}

message ResendVerificationCodeResponse {
  string message = 1;
  bool success = 2;
}

message UpdateUserStatusRequest {
  string target_user_id = 1;
  string status = 2;
  optional string reason = 3;
  optional string suspended_until = 4;
}

message UpdateUserStatusResponse {
  bool success = 1;
  string message = 2;
  string status = 3;
}

message UpdateUserRoleRequest {
  string target_user_id = 1;
  string role = 2;
  optional string cinema_id = 3;
  string actor_id = 4;
  string actor_role = 5;
  optional string actor_cinema_id = 6;
}

message UpdateUserRoleResponse {
  bool success = 1;
  string message = 2;
  string user_id = 3;
  string role = 4;
  optional string cinema_id = 5;
}

message LogoutRequest {
  string user_id = 1;
  string session_id = 2;
}

message LogoutResponse {
  bool success = 1;
  string message = 2;
}

message GoogleLoginRequest {
  string google_id = 1;
  string email = 2;
  string name = 3;
  optional string avatar_url = 4;
  optional string birth_date = 5;
  optional string user_agent = 6;
  optional string ip_address = 7;
}
